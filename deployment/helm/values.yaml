openadservice:
  name: lanelet2-map-server
  image: ghcr.io/openads-project/lanelet2_map_server:v1.2.2
  env:
    # --- name ------
    NAMESPACE: /
    NAME: lanelet2_map_server
    # --- inputs ----
    NAV_SAT_FIX_TOPIC: ~/gps/fix
    # --- other -----
    LOG_LEVEL: info
    USE_SIM_TIME: false
    PARAMS: /docker-ros/ws/install/lanelet2_map_server/share/lanelet2_map_server/config/params.yml
  args:
  - /bin/bash
  - -ic
  - |
    ros2 launch lanelet2_map_server lanelet2_map_server_launch.py \
      namespace:=${NAMESPACE} \
      name:=${NAME} \
      log_level:=${LOG_LEVEL} \
      use_sim_time:=${USE_SIM_TIME} \
      params:=${PARAMS} \
      nav_sat_fix_topic:=${NAV_SAT_FIX_TOPIC}
  rosParamFileMountPath: /docker-ros/ws/install/lanelet2_map_server/share/lanelet2_map_server/config/params.yml
  rosParamFileData: null
