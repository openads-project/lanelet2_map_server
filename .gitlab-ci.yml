ROS2 Industrial CI:
  variables:
    DISABLE_ARCH_AMD64: 'true'
    DISABLE_ARCH_ARM64: 'true'
    DOCKER_IMAGE: ''
    ROS_DISTRO: rolling
    NOT_TEST_BUILD: 'true'
  trigger:
    include:
      - project: fb-fi/ops/docker-ros
        ref: main
        file: .gitlab-ci.template.yml
    strategy: depend