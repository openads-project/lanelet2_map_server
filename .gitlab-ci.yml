include:
  - project: fb-fi/ops/templates/ci-templates
    ref: main
    file: .industrial-ci.template.yml
Test dev-amd64:
  variables:
    DOCKER_IMAGE: ros:humble
    NOT_TEST_BUILD: 'true'
Test dev-arm64:
  variables:
    DOCKER_IMAGE: ros:humble
    NOT_TEST_BUILD: 'true'
variables:
  DISABLE_ARCH_AMD64: 'true'
  DISABLE_ARCH_ARM64: 'true'