ROS2 Industrial CI:
  variables:
    DISABLE_ARCH_AMD64: 'true'
    DISABLE_ARCH_ARM64: 'true'
    DOCKER_IMAGE: gitlab.ika.rwth-aachen.de:5050/fb-fi/ops/docker-base/ros2:latest
    NOT_TEST_BUILD: 'true'
  trigger:
    include:
      - project: fb-fi/ops/docker-ros
        ref: main
        file: .gitlab-ci.template.yml
    strategy: depend