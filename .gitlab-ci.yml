stages:
  - Industrial CI
  - Downstream

ROS1:
  stage: Industrial CI
  trigger:
    include:
      - project: fb-fi/ops/templates/ci-templates
        ref: main
        file: .industrial_ci.template.yml
    strategy: depend
  variables:
    ROS_DISTRO: noetic

ROS2 Humble:
  stage: Industrial CI
  trigger:
    include:
      - project: fb-fi/ops/templates/ci-templates
        ref: main
        file: .industrial_ci.template.yml
    strategy: depend
  variables:
    ROS_DISTRO: humble

ROS2 Jazzy:
  stage: Industrial CI
  trigger:
    include:
      - project: fb-fi/ops/templates/ci-templates
        ref: main
        file: .industrial_ci.template.yml
    strategy: depend
  variables:
    ROS_DISTRO: jazzy

lanelet2_object_list_prediction:
  stage: Downstream
  only:
    - main
  allow_failure: true
  trigger:
    project: fb-fi/its-modules/understanding/lanelet2_object_list_prediction

lanelet2_route_planning:
  stage: Downstream
  only:
    - main
  allow_failure: true
  trigger:
    project: fb-fi/its-modules/planning/lanelet2_route_planning

ros-monitoring:
  stage: Downstream
  only:
    - main
  allow_failure: true
  trigger:
    project: fb-fi/its-modules/monitoring/ros-monitoring